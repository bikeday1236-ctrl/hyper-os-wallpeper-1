name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Створити проєкт
        run: |
          mkdir -p .
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          mkdir -p .
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "JiggleWallpaper"
          include ':app'
          EOF
          mkdir -p .
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          EOF
          mkdir -p app
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'app.jiggle'
              compileSdk 34
              defaultConfig {
                  applicationId 'app.jiggle.wallpaper'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.software.live_wallpaper" android:required="true" />
              <application android:label="@string/app_name" android:icon="@android:drawable/sym_def_app_icon">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:theme="@android:style/Theme.Material.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".JiggleService" android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_WALLPAPER">
                      <intent-filter>
                          <action android:name="android.service.wallpaper.WallpaperService" />
                      </intent-filter>
                      <meta-data android:name="android.service.wallpaper" android:resource="@xml/wallpaper" />
                  </service>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/wallpaper.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <wallpaper xmlns:android="http://schemas.android.com/apk/res/android"
              android:thumbnail="@android:drawable/sym_def_app_icon"
              android:description="@string/desc"
              android:settingsActivity="app.jiggle.MainActivity" />
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Живі шпалери</string>
              <string name="desc">Шпалери з пружинними колами та паралаксом від гіроскопа</string>
          </resources>
          EOF
          mkdir -p app/src/main/java/app/jiggle
          cat > app/src/main/java/app/jiggle/Cfg.java <<'EOF'
          package app.jiggle;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Matrix;
          import android.graphics.Paint;
          import java.io.File;
          import java.util.ArrayList;
          import java.util.List;

          final class Cfg {
              static class C {
                  float x, y, r;
                  C(float x, float y, float r) { this.x = x; this.y = y; this.r = r; }
              }

              static SharedPreferences sp(Context c) { return c.getSharedPreferences("cfg", 0); }

              static List<C> circles(Context c) {
                  List<C> l = new ArrayList<>();
                  String s = sp(c).getString("c", "");
                  if (s.isEmpty()) return l;
                  for (String p : s.split(";")) {
                      String[] a = p.split(",");
                      if (a.length == 3) {
                          try { l.add(new C(Float.parseFloat(a[0]), Float.parseFloat(a[1]), Float.parseFloat(a[2]))); }
                          catch (Exception e) { }
                      }
                  }
                  return l;
              }

              static void save(Context c, List<C> l) {
                  StringBuilder b = new StringBuilder();
                  for (C k : l) {
                      if (b.length() > 0) b.append(';');
                      b.append(k.x).append(',').append(k.y).append(',').append(k.r);
                  }
                  sp(c).edit().putString("c", b.toString()).apply();
              }

              static File img(Context c) { return new File(c.getFilesDir(), "wall.jpg"); }

              /** Фото, обрізане "cover" під розмір W x H. */
              static Bitmap cover(Context c, int W, int H) {
                  File f = img(c);
                  if (!f.exists() || W <= 0 || H <= 0) return null;
                  BitmapFactory.Options o = new BitmapFactory.Options();
                  o.inJustDecodeBounds = true;
                  BitmapFactory.decodeFile(f.getPath(), o);
                  int ss = 1;
                  while (o.outWidth / (ss * 2) >= W && o.outHeight / (ss * 2) >= H) ss *= 2;
                  o = new BitmapFactory.Options();
                  o.inSampleSize = ss;
                  Bitmap b = BitmapFactory.decodeFile(f.getPath(), o);
                  if (b == null) return null;
                  float s = Math.max((float) W / b.getWidth(), (float) H / b.getHeight());
                  Bitmap out = Bitmap.createBitmap(W, H, Bitmap.Config.ARGB_8888);
                  Canvas cv = new Canvas(out);
                  Matrix m = new Matrix();
                  m.postScale(s, s);
                  m.postTranslate((W - b.getWidth() * s) / 2f, (H - b.getHeight() * s) / 2f);
                  cv.drawBitmap(b, m, new Paint(Paint.FILTER_BITMAP_FLAG));
                  b.recycle();
                  return out;
              }
          }
          EOF
          mkdir -p app/src/main/java/app/jiggle
          cat > app/src/main/java/app/jiggle/EditorView.java <<'EOF'
          package app.jiggle;

          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.util.DisplayMetrics;
          import android.view.MotionEvent;
          import android.view.View;
          import java.util.List;

          class EditorView extends View {
              Bitmap bmp;
              List<Cfg.C> cs;
              int sel = -1, drag = -1;
              float defR = 0.2f;
              boolean pend;
              float x0, y0;
              Runnable onSel;
              final Paint pr = new Paint(Paint.ANTI_ALIAS_FLAG);
              final Paint bp = new Paint(Paint.FILTER_BITMAP_FLAG);
              final Paint tx = new Paint(Paint.ANTI_ALIAS_FLAG);
              final float dp;

              EditorView(Context c) {
                  super(c);
                  dp = c.getResources().getDisplayMetrics().density;
                  cs = Cfg.circles(c);
                  pr.setStyle(Paint.Style.STROKE);
                  tx.setColor(0xFFAAAAAA);
                  tx.setTextAlign(Paint.Align.CENTER);
                  tx.setTextSize(16 * dp);
              }

              void reload() {
                  bmp = Cfg.cover(getContext(), getWidth(), getHeight());
                  invalidate();
              }

              @Override protected void onSizeChanged(int w, int h, int ow, int oh) { reload(); }

              @Override protected void onMeasure(int wm, int hm) {
                  int w0 = MeasureSpec.getSize(wm), h0 = MeasureSpec.getSize(hm);
                  DisplayMetrics dm = getResources().getDisplayMetrics();
                  float ratio = (float) dm.heightPixels / dm.widthPixels;
                  int w, h;
                  if (w0 * ratio <= h0) { w = w0; h = (int) (w0 * ratio); }
                  else { h = h0; w = (int) (h0 / ratio); }
                  setMeasuredDimension(w, h);
              }

              @Override protected void onDraw(Canvas c) {
                  int W = getWidth(), H = getHeight();
                  c.drawColor(0xFF000000);
                  if (bmp != null) {
                      c.save();
                      c.scale(1.06f, 1.06f, W / 2f, H / 2f);
                      c.drawBitmap(bmp, 0, 0, bp);
                      c.restore();
                  } else {
                      c.drawText("Обери фото", W / 2f, H / 2f, tx);
                  }
                  for (int i = 0; i < cs.size(); i++) {
                      Cfg.C k = cs.get(i);
                      float cx = k.x * W, cy = k.y * H, r = k.r * W;
                      pr.setStrokeWidth(3 * dp);
                      pr.setColor(i == sel ? 0xFF80EBFF : 0xFFFFFFFF);
                      c.drawCircle(cx, cy, r, pr);
                      pr.setStrokeWidth(1.5f * dp);
                      pr.setColor(0x66FFFFFF);
                      c.drawCircle(cx, cy, r * 2.7f, pr);
                  }
              }

              static float cl(float v) { return Math.max(0f, Math.min(1f, v)); }

              @Override public boolean onTouchEvent(MotionEvent e) {
                  int W = getWidth(), H = getHeight();
                  float x = cl(e.getX() / W), y = cl(e.getY() / H);
                  switch (e.getActionMasked()) {
                      case MotionEvent.ACTION_DOWN:
                          drag = -1;
                          pend = false;
                          for (int i = cs.size() - 1; i >= 0; i--) {
                              Cfg.C k = cs.get(i);
                              double d = Math.hypot((x - k.x) * W, (y - k.y) * H);
                              if (d < k.r * W) { sel = i; drag = i; break; }
                          }
                          if (drag < 0) { pend = true; x0 = e.getX(); y0 = e.getY(); }
                          if (onSel != null) onSel.run();
                          invalidate();
                          return true;
                      case MotionEvent.ACTION_MOVE:
                          if (drag >= 0) { cs.get(drag).x = x; cs.get(drag).y = y; invalidate(); }
                          if (pend && Math.hypot(e.getX() - x0, e.getY() - y0) > 10 * dp) pend = false;
                          return true;
                      case MotionEvent.ACTION_UP:
                          if (pend && cs.size() < 8) {
                              cs.add(new Cfg.C(x, y, defR));
                              sel = cs.size() - 1;
                              if (onSel != null) onSel.run();
                          }
                          pend = false;
                          drag = -1;
                          Cfg.save(getContext(), cs);
                          invalidate();
                          return true;
                      case MotionEvent.ACTION_CANCEL:
                          pend = false;
                          drag = -1;
                          return true;
                  }
                  return super.onTouchEvent(e);
              }

              void deleteSel() {
                  if (sel >= 0 && sel < cs.size()) { cs.remove(sel); sel = -1; Cfg.save(getContext(), cs); invalidate(); }
              }

              void clearAll() { cs.clear(); sel = -1; Cfg.save(getContext(), cs); invalidate(); }

              void setR(float r) {
                  defR = r;
                  if (sel >= 0 && sel < cs.size()) { cs.get(sel).r = r; Cfg.save(getContext(), cs); }
                  invalidate();
              }
          }
          EOF
          mkdir -p app/src/main/java/app/jiggle
          cat > app/src/main/java/app/jiggle/JiggleService.java <<'EOF'
          package app.jiggle;

          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.graphics.Typeface;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.service.wallpaper.WallpaperService;
          import android.view.Choreographer;
          import android.view.SurfaceHolder;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;

          public class JiggleService extends WallpaperService {
              static final int MW = 28, MH = 56;

              @Override public Engine onCreateEngine() { return new E(); }

              class E extends Engine implements SensorEventListener, Choreographer.FrameCallback {
                  SensorManager sm;
                  Sensor acc;
                  boolean vis;
                  int W, H;
                  Bitmap bmp;
                  List<Cfg.C> cs = new ArrayList<>();
                  float k = 1, par = 1;
                  boolean clk, inv;
                  final float[] gv = new float[3];
                  boolean gInit, bInit;
                  float linx, liny, bx, by;
                  final float[] ox = new float[8], oy = new float[8], vx = new float[8], vy = new float[8], sq = new float[8];
                  float px, py;
                  long lastDraw, tSec;
                  String tStr = "";
                  final float[] verts = new float[(MW + 1) * (MH + 1) * 2];
                  final Paint bp = new Paint(Paint.FILTER_BITMAP_FLAG);
                  final Paint tp = new Paint(Paint.ANTI_ALIAS_FLAG);

                  @Override public void onCreate(SurfaceHolder h) {
                      super.onCreate(h);
                      sm = (SensorManager) getSystemService(SENSOR_SERVICE);
                      acc = sm.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);
                  }

                  void load() {
                      SharedPreferences sp = Cfg.sp(JiggleService.this);
                      k = sp.getFloat("k", 1f);
                      par = sp.getFloat("p", 1f);
                      clk = sp.getBoolean("clk", false);
                      inv = sp.getBoolean("inv", false);
                      cs = Cfg.circles(JiggleService.this);
                      if (W > 0 && H > 0) {
                          if (bmp != null) bmp.recycle();
                          bmp = Cfg.cover(JiggleService.this, W, H);
                      }
                  }

                  @Override public void onSurfaceChanged(SurfaceHolder h, int f, int w, int hh) {
                      super.onSurfaceChanged(h, f, w, hh);
                      W = w;
                      H = hh;
                      load();
                  }

                  @Override public void onVisibilityChanged(boolean v) {
                      vis = v;
                      Choreographer.getInstance().removeFrameCallback(this);
                      if (v) {
                          load();
                          bInit = false;
                          lastDraw = 0;
                          if (acc != null) sm.registerListener(this, acc, SensorManager.SENSOR_DELAY_GAME);
                          Choreographer.getInstance().postFrameCallback(this);
                      } else {
                          sm.unregisterListener(this);
                      }
                  }

                  @Override public void onDestroy() {
                      vis = false;
                      sm.unregisterListener(this);
                      Choreographer.getInstance().removeFrameCallback(this);
                      super.onDestroy();
                  }

                  @Override public void onSensorChanged(SensorEvent e) {
                      float[] v = e.values;
                      if (!gInit) { gv[0] = v[0]; gv[1] = v[1]; gv[2] = v[2]; gInit = true; }
                      for (int i = 0; i < 3; i++) gv[i] = 0.92f * gv[i] + 0.08f * v[i];
                      linx = v[0] - gv[0];
                      liny = v[1] - gv[1];
                  }

                  @Override public void onAccuracyChanged(Sensor s, int a) { }

                  @Override public void doFrame(long ns) {
                      if (!vis) return;
                      Choreographer.getInstance().postFrameCallback(this);
                      if (ns - lastDraw < 18000000L) return;
                      float dt = lastDraw == 0 ? 0.016f : Math.min(0.033f, (ns - lastDraw) / 1e9f);
                      lastDraw = ns;
                      step(dt);
                      draw();
                  }

                  void step(float dt) {
                      float s = inv ? -1f : 1f;
                      float gdx = Math.max(-1.2f, Math.min(1.2f, -gv[0] / 9.81f));
                      float gdy = Math.max(-1.2f, Math.min(1.2f, gv[1] / 9.81f));
                      if (!bInit) { bx = gdx; by = gdy; bInit = true; }
                      bx += (gdx - bx) * dt * 0.25f;
                      by += (gdy - by) * dt * 0.25f;
                      float rx = s * (gdx - bx), ry = s * (gdy - by);
                      px = Math.max(-0.5f, Math.min(0.5f, rx)) * par * 0.04f * W;
                      py = Math.max(-0.5f, Math.min(0.5f, ry)) * par * 0.04f * H;
                      float tgx = rx * 0.05f * k, tgy = ry * 0.05f * k;
                      float ax = linx * s, ay = -liny * s;
                      int n = Math.min(cs.size(), 8);
                      for (int i = 0; i < n; i++) {
                          float w0 = 9.5f * (1 + 0.06f * i), zt = 0.07f;
                          vx[i] += (-w0 * w0 * (ox[i] - tgx) - 2 * zt * w0 * vx[i] - 0.03f * k * ax) * dt;
                          vy[i] += (-w0 * w0 * (oy[i] - tgy) - 2 * zt * w0 * vy[i] - 0.05f * k * ay) * dt;
                          ox[i] = 0.05f * (float) Math.tanh((ox[i] + vx[i] * dt) / 0.05f);
                          oy[i] = 0.05f * (float) Math.tanh((oy[i] + vy[i] * dt) / 0.05f);
                          sq[i] = Math.max(-0.07f, Math.min(0.07f, vy[i] * 0.2f));
                      }
                  }

                  void draw() {
                      SurfaceHolder h = getSurfaceHolder();
                      Canvas c = null;
                      try {
                          c = Build.VERSION.SDK_INT >= 26 ? h.lockHardwareCanvas() : h.lockCanvas();
                          if (c != null) render(c);
                      } catch (Exception ex) {
                      } finally {
                          if (c != null) {
                              try { h.unlockCanvasAndPost(c); } catch (Exception ex) { }
                          }
                      }
                  }

                  void render(Canvas c) {
